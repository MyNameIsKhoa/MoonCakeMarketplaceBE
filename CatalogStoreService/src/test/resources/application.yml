spring:
  datasource:
    url: jdbc:h2:mem:catalog_test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway.enabled: false
  jpa.hibernate.ddl-auto: create-drop

security:
  jwt:
    secret: MoonCakeMarketplaceTestSecretKeyMustBeAtLeast256BitsLong!
    issuer: mooncake-identity
    audience: mooncake-api
  internal-service-tokens:
    commerce: test-commerce-catalog-token-32-bytes-minimum
    rfq: test-rfq-catalog-token-32-bytes-minimum
  outgoing-identity-token: test-catalog-identity-token-32-bytes-minimum

clients:
  identity:
    url: http://localhost:9999
