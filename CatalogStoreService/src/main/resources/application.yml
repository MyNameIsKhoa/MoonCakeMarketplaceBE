spring:
  application:
    name: catalog-store-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:sqlserver://localhost:14332;databaseName=mss_catalog_store;encrypt=false;trustServerCertificate=true}
    username: ${CATALOG_DB_USERNAME:sa}
    password: ${CATALOG_DB_PASSWORD:YourStrong(!)Password}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate.ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8082}
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
