spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: catalog-store-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${CATALOG_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=mss_catalog_store;encrypt=false;trustServerCertificate=true}
    username: ${CATALOG_DB_USERNAME:sa}
    password: ${CATALOG_DB_PASSWORD:sa}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate.ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8082}
app:
  catalog-images:
    directory: ${CATALOG_UPLOAD_DIR:${user.home}/.mooncake/uploads/catalog}
    public-base-url: ${CATALOG_PUBLIC_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:mooncake-identity}
    audience: ${JWT_AUDIENCE:mooncake-api}
  internal-service-tokens:
    commerce: ${COMMERCE_TO_CATALOG_TOKEN}
    rfq: ${RFQ_TO_CATALOG_TOKEN}
  outgoing-identity-token: ${CATALOG_TO_IDENTITY_TOKEN}
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html

# Feign client URLs
clients:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

