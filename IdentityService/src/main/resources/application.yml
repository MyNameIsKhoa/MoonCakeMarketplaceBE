spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=mss_identity;encrypt=false;trustServerCertificate=true}
    username: ${IDENTITY_DB_USERNAME:sa}
    password: ${IDENTITY_DB_PASSWORD:sa}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
server:
  port: ${SERVER_PORT:8081}
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  auth:
    email-verification-ttl-minutes: ${EMAIL_VERIFICATION_TTL_MINUTES:1440}
    password-reset-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:10}
security:
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:}}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:mooncake-identity}
    audience: ${JWT_AUDIENCE:mooncake-api}
  internal-service-tokens:
    catalog: ${CATALOG_TO_IDENTITY_TOKEN}
    commerce: ${COMMERCE_TO_IDENTITY_TOKEN}
    rfq: ${RFQ_TO_IDENTITY_TOKEN}
  admin:
    user-ids: ${ADMIN_USER_IDS:11}
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
