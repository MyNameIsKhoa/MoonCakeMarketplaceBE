spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:sqlserver://localhost:14331;databaseName=mss_identity;encrypt=false;trustServerCertificate=true}
    username: ${IDENTITY_DB_USERNAME:sa}
    password: ${IDENTITY_DB_PASSWORD:YourStrong(!)Password}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8081}
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
