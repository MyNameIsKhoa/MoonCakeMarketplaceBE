spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: commerce-service
  datasource:
    url: ${COMMERCE_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=mss_commerce;encrypt=false;trustServerCertificate=true}
    username: ${COMMERCE_DB_USERNAME:sa}
    password: ${COMMERCE_DB_PASSWORD:sa}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate.ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
services:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
server:
  port: ${SERVER_PORT:8083}
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:mooncake-identity}
    audience: ${JWT_AUDIENCE:mooncake-api}
  internal-service-tokens:
    rfq: ${RFQ_TO_COMMERCE_TOKEN}
  outgoing-identity-token: ${COMMERCE_TO_IDENTITY_TOKEN}
  outgoing-catalog-token: ${COMMERCE_TO_CATALOG_TOKEN}
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:http://localhost:3000/?finance=return}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/?finance=cancel}
finance:
  settlement:
    fee-basis: ${FINANCE_FEE_BASIS:NET_AFTER_REFUND}
    rounding: ${FINANCE_FEE_ROUNDING:HALF_UP}
  dispute:
    admin-adjudication-enabled: ${FINANCE_DISPUTE_ADMIN_ENABLED:true}
commerce:
  rfq:
    # Unpaid RFQ orders are cancelled by the system this many hours after placed_at.
    deposit-timeout-hours: 48
    deposit-timeout-cron: "0 */5 * * * *"
  retail:
    # Unpaid retail checkouts are cancelled by the system (stock restored) this many minutes after placed_at.
    payment-timeout-minutes: 60
    payment-timeout-cron: "0 * * * * *"
    # Without an agreed delivery date, a buyer may open a non-delivery dispute this many days after full payment.
    shipping-sla-days: 7
  fulfillment:
    # Delivered orders not accepted nor disputed within the 7-day dispute window are accepted by the system.
    auto-accept-cron: "0 */10 * * * *"
