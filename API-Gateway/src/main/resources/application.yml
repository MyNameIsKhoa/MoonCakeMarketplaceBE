spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-openapi
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/identity/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: catalog-openapi
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/catalog/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: commerce-openapi
              uri: ${COMMERCE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/commerce/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: rfq-openapi
              uri: ${RFQ_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/rfq/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: admin-catalog
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/admin/catalog/**
            - id: admin-commerce-metrics
              uri: ${COMMERCE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/admin/commerce/**
            - id: admin-rfq-metrics
              uri: ${RFQ_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/admin/rfq/**
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/addresses/**,/api/admin/**,/api/suppliers,/api/suppliers/**
            - id: supplier-profile-identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/supplier-profile/**
            - id: notification-identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/notifications,/api/notifications/**
            - id: catalog-store-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/stores/**,/api/products/**,/api/categories/**,/api/promotions/**
            - id: catalog-images
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/uploads/catalog/**
                - Method=GET
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: commerce-service
              uri: ${COMMERCE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/cart,/api/cart/**,/api/checkout,/api/checkout/**,/api/orders,/api/orders/**,/api/seller-orders,/api/seller-orders/**,/api/payments/**,/api/cancellations/**,/api/refunds/**,/api/shipments/**,/api/disputes/**,/api/settlements/**,/api/reviews/**
            - id: rfq-negotiation-service
              uri: ${RFQ_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/rfqs/**,/api/quotations/**,/api/conversations/**,/api/messages/**
server:
  port: ${SERVER_PORT:8080}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:mooncake-identity}
    audience: ${JWT_AUDIENCE:mooncake-api}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: API Gateway
    urls:
      - name: API Gateway
        url: /v3/api-docs
      - name: Identity Service
        url: /identity/v3/api-docs
      - name: Catalog and Store Service
        url: /catalog/v3/api-docs
      - name: Commerce Service
        url: /commerce/v3/api-docs
      - name: RFQ and Negotiation Service
        url: /rfq/v3/api-docs
