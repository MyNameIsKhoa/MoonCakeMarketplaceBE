spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: rfq-negotiation-service
  datasource:
    url: ${RFQ_DB_URL:jdbc:sqlserver://localhost:14334;databaseName=mss_rfq_negotiation;encrypt=false;trustServerCertificate=true}
    username: ${RFQ_DB_USERNAME:sa}
    password: ${RFQ_DB_PASSWORD:sa}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate.ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
services:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  commerce:
    base-url: ${COMMERCE_SERVICE_URL:http://localhost:8083}
server:
  port: ${SERVER_PORT:8084}
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:mooncake-identity}
    audience: ${JWT_AUDIENCE:mooncake-api}
  outgoing-identity-token: ${RFQ_TO_IDENTITY_TOKEN}
  outgoing-catalog-token: ${RFQ_TO_CATALOG_TOKEN}
  outgoing-commerce-token: ${RFQ_TO_COMMERCE_TOKEN}
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
