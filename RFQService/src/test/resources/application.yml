spring:
  datasource:
    url: jdbc:h2:mem:rfq_test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway.enabled: false
  jpa.hibernate.ddl-auto: create-drop
security:
  jwt:
    secret: MoonCakeMarketplaceTestSecretKeyMustBeAtLeast256BitsLong!
    issuer: mooncake-identity
    audience: mooncake-api
  outgoing-identity-token: test-rfq-identity-token-32-bytes-minimum
  outgoing-catalog-token: test-rfq-catalog-token-32-bytes-minimum
  outgoing-commerce-token: test-rfq-commerce-token-32-bytes-minimum
